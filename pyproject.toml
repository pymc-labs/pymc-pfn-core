[project]
name = "pymc-pfn"
version = "0.1.0"
description = "Amortized posterior networks for priors written as PyMC models"
readme = "README.md"
authors = [
    { name = "Thomas Wiecki", email = "thomas.wiecki@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.optional-dependencies]
prior = [
    "pymc>=6.4.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
